# nginx-unprivileged serves the character-studio remote on :8080.
# remoteEntry.json + the federated chunks must be reachable by the host shell;
# everything else falls back to index.html (SPA) so the dev-shell route resolves.
#
# Per-response CSP nonce source. nginx has no random function, so we reuse
# $request_id (a fresh 32-hex token per request): unguessable and different every
# response, which is exactly what a nonce must be. The `map` exposes it as
# $cspnonce so the sub_filter rewrite and the CSP header below reference the SAME
# value for a given response.
#
# Scope note: the Dockerfile installs this file as
# `COPY nginx.conf /etc/nginx/conf.d/default.conf`, and the stock
# nginx-unprivileged /etc/nginx/nginx.conf does `include /etc/nginx/conf.d/*.conf;`
# from INSIDE the http block — so this file is http-scope and a bare `map` here is
# legal (it must NOT be wrapped in an http { } block).
#
# WHY THIS EXISTS: the Angular native-federation build emits an INLINE
# `<script type="esms-options">` in index.html and loads main via
# `type="module-shim"`. The gateway sends a fallback CSP of `script-src 'self'`
# to any UI that does not send its own, which blocks that inline script — so
# es-module-shims is never configured, the module-shim bundle never runs, Angular
# never bootstraps, and the page renders BLANK with no server error. The nonce
# below is what makes the inline script legal again.
map $request_id $cspnonce {
    default $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection. This remote is loaded by
    #     the host shell via <script> (native federation), never via <iframe>.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    # NOTE: nginx add_header does NOT merge across blocks — a location with ANY
    # add_header of its own DISCARDS every inherited one — so this set is
    # re-declared in each location below that sets headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hashed immutable bundles — long cache.
    # Runtime theme (fleet 50-snap-theme.sh mechanism): served from /tmp — the
    # entrypoint hook's SNAP_THEME_OUT — via an exact-match alias, so the SPA
    # catch-all can never shadow it and an empty theme is a zero-byte 200
    # (shipped brand), never an index.html masquerading as a stylesheet.
    # no-store: a rebrand is env + restart; a cached copy would pin the brand.
    location = /snap-theme.css {
        alias /tmp/snap-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css|woff2?|png|svg|webp|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # remoteEntry.json must always be fresh (it maps the exposed modules).
    location = /remoteEntry.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off       : index.html has several <script> tags.
        #   - sub_filter_types text/html: ONLY rewrite HTML; the JS/CSS bundles
        #                                 are left byte-for-byte untouched.
        # es-module-shims (2.x) auto-propagates the nonce to the module scripts it
        # injects, so native federation keeps working under a nonce-only policy.
        # Do NOT enable gzip_static / precompressed index.html here — sub_filter
        # cannot rewrite an already-compressed body, which would silently
        # reintroduce the blank-page bug this config exists to fix.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # script-src carries the nonce and NO 'unsafe-inline' (which browsers
        # ignore anyway once a nonce is present). style-src DOES need
        # 'unsafe-inline': Angular writes component styles inline at runtime and
        # they cannot be nonced. blob: in img-src/connect-src covers the export
        # panel's URL.createObjectURL download (export-panel.component.ts:50).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: https: wss:; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
