  <g transform="rotate(-38 372 246)"><rect class="region-accent" x="317" y="235" width="110" height="22" rx="11"/></g>
  <circle class="region-detail" cx="372" cy="246" r="9"/>
  <g transform="rotate(38 424 300)"><rect class="region-accent" x="385" y="292" width="78" height="16" rx="8"/></g>
  <g transform="rotate(-38 424 300)"><rect class="region-accent" x="385" y="292" width="78" height="16" rx="8"/></g>
  <circle class="region-detail" cx="424" cy="300" r="7"/>
</svg>
